/* обложки: пиксельный пейзаж по цвету и id */
function hsh(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cover(seed,c,cls){const W=32,H=10,r=rng(hsh(seed));let o='';
  const sx=2+Math.floor(r()*(W-6)),sy=1+Math.floor(r()*2);
  o+=`<rect x="${sx}" y="${sy}" width="3" height="3" fill="#FFE9A8" opacity=".85"/><rect x="${sx}" y="${sy+1}" width="3" height="1" fill="#FFE9A8"/>`;
  for(let i=0;i<7;i++){const x=Math.floor(r()*W),y=Math.floor(r()*4);if(Math.abs(x-sx-1)>3)o+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#fff" opacity="${.35+r()*.4}"/>`;}
  let y=5+Math.floor(r()*2);
  for(let x=0;x<W;x++){y+=Math.floor(r()*3)-1;y=Math.max(4,Math.min(8,y));
    for(let j=y;j<H;j++)o+=`<rect x="${x}" y="${j}" width="1.02" height="1.02" fill="currentColor" opacity="${j===y?1:(j===y+1?.7:.45)}"/>`;}
  return `<div class="cov ${cls||''}" style="--c:${col(c)}" aria-hidden="true"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges">${o}</svg></div>`;}

function wheelData(){const mon=mondayOf(now),days=[...Array(7)].map((_,i)=>addD(mon,i)),monMs=new Date(mon+'T00:00').getTime(),cl=x=>Math.max(0,Math.min(10,x));

let doneT=null;
function hubClick(ev){const T=ev.target;let b;
  if(h2Click(ev)||h3Click(ev)||h5Click(ev)||h8Click(ev)||h9Click(ev)||h10Click(ev)||h11Click(ev)||h12Click(ev)||h13Click(ev)||h14Click(ev))return;
  if((b=T.closest('[data-xclose]'))){closeSheet();return;}
  if((b=T.closest('[data-xdone]'))){const t=taskById(b.dataset.xdone);if(!t)return;t.done=!t.done;t.doneAt=t.done?Date.now():null;docSet('tasks');xpAdd(t.done?10:-10);hap(t.done?'ok':'light');
    b.setAttribute('aria-pressed',String(t.done));const row=b.closest('.trow');if(row){row.classList.toggle('done',t.done);if(t.done)row.classList.add('fade');}
    if(t.done)toast('Готово: '+t.t,'Вернуть',()=>{t.done=false;t.doneAt=null;docSet('tasks');xpAdd(-10);rerender();});
    clearTimeout(doneT);doneT=setTimeout(()=>{if(!busy())rerender();else pendingRender=true;},700);return;}
  if((b=T.closest('[data-xedit]'))){taskSheet(b.dataset.xedit);return;}
  if((b=T.closest('[data-xlink]'))){const u=b.dataset.xlink;try{if(TG&&TGV('6.4'))TG.openLink(u);else window.open(u,'_blank','noopener');}catch(e){window.open(u,'_blank','noopener');}return;}
  if((b=T.closest('[data-xdest]'))){const f=b.closest('.qaw').querySelector('form');f.dataset.dest=b.dataset.xdest;qaPreview(f);hap('sel');return;}
  if((b=T.closest('[data-xqafix]'))){const f=b.closest('.qaw').querySelector('form');const r=qaParse(f);if(r)taskSheet(null,{t:r.title,due:r.due,time:r.time,subj:r.subj,tag:r.tag,prio:r.prio});return;}
  if((b=T.closest('[data-xnewsubj]'))){const name=b.dataset.xnewsubj;const used=subjs().map(x=>x.c);subjs().push({id:nid(),name,alias:[],c:Object.keys(HC).find(k=>!used.includes(k))||'lilac'});docSet('subj');hap('ok');
    const f=b.closest('.qaw').querySelector('form');qaPreview(f);toast('Предмет «'+name+'» добавлен');return;}
  if((b=T.closest('[data-xhd]'))){const [id,d]=b.dataset.xhd.split('|');const on=htoggle(id,d);b.setAttribute('aria-pressed',String(on));hap(on?'light':'sel');
    if(location.hash==='#habits'||location.hash==='#home'||!location.hash){clearTimeout(doneT);doneT=setTimeout(()=>{if(!busy())rerender();},400);}return;}
  if((b=T.closest('[data-xhedit]'))){habitSheet(b.dataset.xhedit);return;}
  if((b=T.closest('[data-xgs]'))){const [gid,sid]=b.dataset.xgs.split('|');const g=goalById(gid);const s=g&&g.steps.find(x=>x.id===sid);if(!s)return;s.d=!s.d;docSet('goals');hap(s.d?'ok':'light');rerender();return;}
  if((b=T.closest('[data-xgsdel]'))){const [gid,sid]=b.dataset.xgsdel.split('|');const g=goalById(gid);if(!g)return;rm(g.steps,x=>x.id===sid);docSet('goals');rerender();return;}
  if((b=T.closest('[data-xgc]'))){const [gid,k]=b.dataset.xgc.split('|');const g=goalById(gid);if(!g)return;g.n=Math.max(0,(g.n||0)+(+k));docSet('goals');hap(+k>0?'light':'sel');if(+k>0&&g.n===g.target)hap('ok');rerender();return;}
  if((b=T.closest('[data-xgedit]'))){goalSheet(b.dataset.xgedit);return;}
  if((b=T.closest('[data-xgmon]'))){goalMonth=mShift(goalMonth,+b.dataset.xgmon);rerender();return;}
  if((b=T.closest('[data-xgmove]'))){const cur=TODAY.slice(0,7);goals().filter(g=>g.m===b.dataset.xgmove&&gprog(g).p<1).forEach(g=>{g.m=cur;});goalMonth=cur;docSet('goals');hap('ok');rerender();return;}
  if((b=T.closest('[data-xgsug]'))){const [kind,t,n]=b.dataset.xgsug.split('|');const g={id:nid(),t,kind,target:+n||1,m:goalMonth,n:0,steps:[],ts:Date.now()};goals().push(g);docSet('goals');hap('ok');rerender();
    if(kind==='steps'){const inp=document.querySelector(`[data-xgadd="${g.id}"] input`);if(inp)inp.focus();}return;}
  if((b=T.closest('[data-xtf]'))){taskF=b.dataset.xtf;rerender();return;}
  if((b=T.closest('[data-xstudyall]'))){studyAll=true;rerender();return;}
  if((b=T.closest('[data-xncat]'))){noteCat=b.dataset.xncat;rerender();return;}
  if((b=T.closest('[data-xcatedit]'))){catSheet(b.dataset.xcatedit);return;}
  if((b=T.closest('[data-xsedit]'))){subjSheet(b.dataset.xsedit);return;}
  if((b=T.closest('[data-xnnew]'))){const sj=b.dataset.xnnew||null;const cid=sj?(cats().find(c=>c.id==='study')||cats()[0]).id:(noteCat!=='all'?noteCat:cats()[0].id);const c=catById(cid);
    const n={id:nid(),cat:c.id,title:'',body:'',items:c.list?[{t:'',d:false}]:null,pin:false,subj:sj,ts:Date.now()};notes().unshift(n);docSet('notes');
    history.pushState(null,'','#note-'+n.id);route();const ti=document.querySelector('.ntitle');if(ti)ti.focus();return;}
  if((b=T.closest('[data-xpin]'))){const n=curNote();if(!n)return;n.pin=!n.pin;docSet('notes');b.setAttribute('aria-pressed',String(n.pin));b.textContent=n.pin?'Закреплено':'Закрепить';hap('light');return;}
  if((b=T.closest('[data-xnmode]'))){const n=curNote();if(!n)return;
    if(n.items){n.body=n.items.map(i=>i.t).filter(t=>t.trim()).join('\n');n.items=null;}else{const L=(n.body||'').split('\n').map(s=>s.trim()).filter(Boolean);n.items=L.length?L.map(t=>({t,d:false})):[{t:'',d:false}];n.body='';}
    n.ts=Date.now();docSet('notes');rerender();return;}
  if((b=T.closest('[data-xni]'))){const n=curNote();if(!n||!n.items)return;const it=n.items[+b.dataset.xni];if(!it)return;it.d=!it.d;n.ts=Date.now();docSet('notes');b.setAttribute('aria-pressed',String(it.d));b.closest('li').classList.toggle('d',it.d);hap('light');return;}
  if((b=T.closest('[data-xniadd]'))){const n=curNote();if(!n||!n.items)return;n.items.push({t:'',d:false});noteDirty();renderItems(n,n.items.length-1);return;}
  if((b=T.closest('[data-xdel]'))){if(!armed(b))return;const [k,id]=b.dataset.xdel.split(':');doDelete(k,id);return;}
  if((b=T.closest('[data-acc]'))&&sheetEl&&sheetEl.contains(b)){accent=b.dataset.acc;store.set('pp-accent',accent);applyAccent();saveAcc();sheetEl.querySelectorAll('[data-acc]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));hap('sel');return;}
}
function curNote(){const h=(location.hash||'').slice(1);return h.startsWith('note-')?noteById(h.slice(5)):null;}
function renderItems(n,focus){const ul=document.getElementById('nitems');if(!ul)return;ul.innerHTML=itemsHTML(n);if(focus!=null){const inp=ul.querySelector(`[data-xnit="${focus}"]`);if(inp){inp.focus();const L=inp.value.length;try{inp.setSelectionRange(L,L);}catch(e){}}}}
function hubSubmit(ev){const f=ev.target;
  if(f.matches('form.qa')){ev.preventDefault();qaSubmit(f);if(sheetEl&&sheetEl.contains(f))closeSheet();return;}
  if(f.matches('form[data-xform]')){ev.preventDefault();saveForm(f);return;}
  if(f.matches('form.gadd')){ev.preventDefault();const g=goalById(f.dataset.xgadd);const inp=f.querySelector('input');const v=inp.value.trim();if(!g||!v)return;g.steps.push({id:nid(),t:v,d:false});docSet('goals');hap('light');rerender();
    const ni=document.querySelector(`[data-xgadd="${g.id}"] input`);if(ni)ni.focus();return;}}
function hubInput(ev){const T=ev.target;
  if(h2Input(ev)||h8Input(ev))return;
  if(T.classList.contains('qain')){qaPreview(T.form);return;}
  if(T.classList.contains('nsearch')){noteQ=T.value;const g=document.getElementById('ngrid');if(g)g.innerHTML=notesGrid();return;}
  if(T.dataset.xnf){const n=curNote();if(!n)return;n[T.dataset.xnf]=T.value;n.ts=Date.now();noteDirty();if(T.tagName==='TEXTAREA')grow(T);const nl=document.getElementById('nlinks');if(nl)nl.innerHTML=linksHTML(n);return;}
  if(T.dataset.xnit!=null){const n=curNote();if(!n||!n.items)return;const it=n.items[+T.dataset.xnit];if(it){it.t=T.value;n.ts=Date.now();noteDirty();}return;}}
function hubKey(ev){const T=ev.target;if(T.dataset.xnit==null)return;const n=curNote();if(!n||!n.items)return;const i=+T.dataset.xnit;
  if(ev.key==='Enter'){ev.preventDefault();n.items.splice(i+1,0,{t:'',d:false});noteDirty();renderItems(n,i+1);}
  else if(ev.key==='Backspace'&&T.value===''&&n.items.length>1){ev.preventDefault();n.items.splice(i,1);noteDirty();renderItems(n,Math.max(0,i-1));}}
function hubChange(ev){const T=ev.target;if(T.matches('[data-xncatsel]')){const n=curNote();if(!n)return;n.cat=T.value;n.ts=Date.now();docSet('notes');hap('sel');}}
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,window.innerHeight*.4)+'px';}
viewEl.addEventListener('click',hubClick);
viewEl.addEventListener('submit',hubSubmit);
viewEl.addEventListener('input',hubInput);
viewEl.addEventListener('keydown',hubKey);
viewEl.addEventListener('change',hubChange);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOn)closeSheet();});
const TXT='input:not([type=radio]):not([type=checkbox]):not([type=date]):not([type=time]),textarea';
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches(TXT))document.body.classList.add('typing');});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches(TXT)))document.body.classList.remove('typing');if(pendingRender&&!busy()){pendingRender=false;rerender();}},80);});
document.getElementById('hgear').addEventListener('click',settingsSheet);
function hubMount(h,keep){
  let r=hubRoute(h);if(!r){h='home';r=hubRoute('home');}
  document.body.classList.add('hub');document.body.classList.remove('playing');
  mount(r.html);
  document.querySelectorAll('#hnav a').forEach(a=>{if(a.dataset.sec===r.sec)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  brandEl.innerHTML=r.title+'<span>.</span>';document.body.dataset.hs=h;lvlUpdate();backRoot=r.root;syncBack();prevHash=h;
  const ta=viewEl.querySelector('.nbody');if(ta)grow(ta);
  if(!keep){if(!reduce){viewEl.classList.remove('enter');void viewEl.offsetWidth;viewEl.classList.add('enter');}window.scrollTo(0,0);}}


/* ================= INTERACTION ================= */
viewEl.addEventListener('click',ev=>{
  const T=ev.target;
  const pb=T.closest('[data-p]');if(pb){if(!pb.disabled)playClick(pb.dataset.p);return;}
  const set=T.closest('.set[data-key]');
  if(set){const k=set.dataset.key,i=+set.dataset.i;const arr=ticks[k]||[];arr[i]=!arr[i];ticks[k]=arr;saveTicks();
    set.setAttribute('aria-pressed',arr[i]?'true':'false');if(arr[i])startRest(+set.dataset.rest);return;}
  const tb=T.closest('[data-top]');if(tb){const id=tb.dataset.top;LOG.top[id]=LOG.top[id]||{};if(LOG.top[id][TODAY])delete LOG.top[id][TODAY];else LOG.top[id][TODAY]=true;saveLog();refreshLog();return;}
  const pd=T.closest('[data-pd]');if(pd){const k='pd:'+pd.dataset.pd;ticks[k]=!ticks[k];saveTicks();pd.setAttribute('aria-pressed',ticks[k]?'true':'false');const rg=document.getElementById('rings');if(rg)rg.innerHTML=ringsInner();return;}
  const dy=T.closest('[data-day]');if(dy){statSel=dy.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',b===dy?'true':'false'));const bx=document.getElementById('dayBox');if(bx)bx.innerHTML=dayDetail(statSel);return;}
  const mo=T.closest('[data-mon]');if(mo&&!mo.disabled){statOff=Math.min(0,statOff+(+mo.dataset.mon));const sy=scrollY;mount(vStats());scrollTo(0,sy);return;}
  const ac=T.closest('[data-acc]');if(ac){accent=ac.dataset.acc;store.set('pp-accent',accent);applyAccent();saveAcc();document.querySelectorAll('[data-acc]').forEach(b=>b.setAttribute('aria-pressed',b===ac?'true':'false'));return;}
  const sb=T.closest('[data-start]');if(sb){let d=mondayOf(now);if(sb.dataset.start==='next'){const x=new Date(d+'T12:00');x.setDate(x.getDate()+7);d=iso(x);}setStart(d);return;}
  if(T.closest('#startSave')){const v=document.getElementById('startIn').value;if(/^\d{4}-\d{2}-\d{2}$/.test(v))setStart(v);return;}
  if(T.closest('#stepsSave')){const inp=document.getElementById('stepsIn');const raw=inp.value.trim();const v=parseInt(raw.replace(/\D/g,''),10);
    if(raw===''){delete LOG.steps[TODAY];}else if(isFinite(v)&&v>=0&&v<=100000){LOG.steps[TODAY]=v;}else return;
    inp.blur();saveLog();refreshLog();return;}
  if(T.closest('#measSave')){const vals={waist:parseNum(document.getElementById('mWaist').value,200),hips:parseNum(document.getElementById('mHips').value,250),arm:parseNum(document.getElementById('mArm').value,100),body:parseNum(document.getElementById('mBody').value,300)};
    const d=document.getElementById('mDate').value||TODAY;const msg=document.getElementById('measMsg');const clean={};for(const k in vals)if(vals[k]!=null)clean[k]=vals[k];
    if(!Object.keys(clean).length){msg.textContent='Впиши хотя бы одно число';return;}
    LOG.measures[d]={...(LOG.measures[d]||{}),...clean};saveLog();['mWaist','mHips','mArm','mBody'].forEach(i=>document.getElementById(i).value='');msg.textContent='Сохранено';setTimeout(()=>{msg.textContent=''},2500);refreshLog();return;}
  const done=T.closest('.done[data-key]');
  if(done){const k=done.dataset.key;ticks[k]=!ticks[k];saveTicks();done.setAttribute('aria-pressed',ticks[k]?'true':'false');done.textContent=ticks[k]?'Сделано ✓':'Отметить';return;}
  const del=T.closest('[data-delm],[data-delw]');
  if(del){if(del.dataset.armed!=='1'){del.dataset.armed='1';del.textContent='Удалить?';setTimeout(()=>{if(del.isConnected){del.dataset.armed='';del.textContent='✕';}},3000);return;}
    if(del.dataset.delm)delete LOG.measures[del.dataset.delm];else{const [ex,d]=del.dataset.delw.split('|');if(LOG.weights[ex])delete LOG.weights[ex][d];}
    saveLog();refreshLog();return;}
  const ws=T.closest('[data-wsel]');
  if(ws){wSel=ws.dataset.wsel;document.getElementById('wBox').innerHTML=wInner();return;}
  const tv=T.closest('[data-tv]');
  if(tv){const box=document.getElementById('techfig');const old=box.querySelector('svg.figsvg');if(old&&old._p){io.unobserve(old);live.delete(old._p);players=players.filter(p=>p!==old._p);}
    box.innerHTML=figHTML(tv.dataset.tv,tv.textContent);bindFigs(box);
    tv.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===tv?'true':'false'));return;}
  const fig=T.closest('.fig');
  if(fig&&!reduce){const svg=fig.querySelector('svg.figsvg');const p=svg&&svg._p;if(!p||!p.seq.length)return;p.paused=!p.paused;
    const b=fig.querySelector('.pp');if(b){b.setAttribute('aria-label',p.paused?'Запустить анимацию':'Пауза анимации');b.innerHTML=p.paused?'<svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg>':'<svg viewBox="0 0 12 12"><rect x="2" y="1.5" width="2.8" height="9" rx="1"/><rect x="7.2" y="1.5" width="2.8" height="9" rx="1"/></svg>';}}
});
const wTimers={};
viewEl.addEventListener('input',ev=>{const w=ev.target.dataset&&ev.target.dataset.w;if(!w)return;const val=ev.target.value;clearTimeout(wTimers[w]);
  wTimers[w]=setTimeout(()=>{wTimers[w]=null;const v=parseNum(val,300);LOG.weights[w]=LOG.weights[w]||{};if(v==null){if(String(val).trim()==='')delete LOG.weights[w][TODAY];else return;}else LOG.weights[w][TODAY]=v;saveLog();},500);});
let sx=0,sy=0,sOn=false;
viewEl.addEventListener('touchstart',e=>{sOn=location.hash.startsWith('#go-')&&!!PL&&!PL.done&&!e.target.closest('.pdock,input,textarea,details,.pfig');if(!sOn)return;const q=e.touches[0];sx=q.clientX;sy=q.clientY;},{passive:true});
viewEl.addEventListener('touchend',e=>{if(!sOn)return;sOn=false;const q=e.changedTouches[0],dx=q.clientX-sx,dy=q.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dy)<60){if(dx<0){slideDir=1;plGo(PL.i+1);}else if(PL.i>0){slideDir=-1;plGo(PL.i-1);}}},{passive:true});
viewEl.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='stepsIn'){ev.preventDefault();document.getElementById('stepsSave')?.click();}});

/* rest timer */
const restEl=document.getElementById('rest'),rt=document.getElementById('rt'),rl=document.getElementById('rl'),ring=document.getElementById('ring');
let rEnd=0,rTot=0,rTimer=null,rHide=null;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startRest(sec,cb,label){restEndCb=cb||null;restRunning=true;restLabel=label||'отдых';clearTimeout(rHide);rTot=sec;rEnd=Date.now()+sec*1000;restEl.hidden=false;restEl.classList.remove('fin');rl.textContent=restLabel;tick();clearInterval(rTimer);rTimer=setInterval(tick,250);}
function tick(){const left=Math.max(0,Math.ceil((rEnd-Date.now())/1000));rt.textContent=fmt(left);ring.style.strokeDashoffset=(100.5*(1-left/rTot)).toFixed(1);
  const prt=document.getElementById('prt');if(prt)prt.textContent=fmt(left);
  if(left<=0&&restRunning){restRunning=false;const cb=restEndCb;restEndCb=null;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    if(location.hash.startsWith('#go-')){clearInterval(rTimer);restEl.hidden=true;if(cb)cb();else renderPlay();return;}}
  if(left<=0){clearInterval(rTimer);restEl.classList.add('fin');rt.textContent='Время';rl.textContent='следующий подход';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}rHide=setTimeout(()=>{restEl.hidden=true},5000);}}
document.getElementById('rplus').onclick=()=>{if(restEl.classList.contains('fin')){startRest(15);return;}rEnd+=15000;rTot+=15;tick();};
document.getElementById('rstop').onclick=()=>{clearInterval(rTimer);clearTimeout(rHide);restEl.hidden=true;restRunning=false;restEndCb=null;};

/* screen wake lock */
const wakeBtn=document.getElementById('wake');let lock=null;
async function setWake(on){
  if(on){try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{if(!document.hidden){wakeBtn.setAttribute('aria-pressed','false');wakeBtn.textContent='Экран гаснет';}});wakeBtn.setAttribute('aria-pressed','true');wakeBtn.textContent='Экран не гаснет';}
    catch(e){wakeBtn.textContent='Тут недоступно';setTimeout(()=>{wakeBtn.textContent='Экран гаснет'},2200);}}
  else{try{lock&&await lock.release()}catch(e){}lock=null;wakeBtn.setAttribute('aria-pressed','false');wakeBtn.textContent='Экран гаснет';}
}
wakeBtn.onclick=()=>setWake(wakeBtn.getAttribute('aria-pressed')!=='true');
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&wakeBtn.getAttribute('aria-pressed')==='true'&&!lock)setWake(true);if(document.hidden)lock=null;});

backfillDays();recordDay();
route();
tgColors();syncNow();srvSync();
</script>
